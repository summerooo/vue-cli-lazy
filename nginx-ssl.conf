# =========================================================================
# vue-cli-lazy 生产环境 HTTPS (SSL) 标准 Nginx 配置文件 
# 完美对齐 src/config/index.js 中的生产域名 yourdomain.com 多微服务代理
# =========================================================================

# 1. HTTP 80 端口服务块：强制 301 重定向至 443 HTTPS
server {
    listen 80;
    server_name yourdomain.com; # 替换为您的线上域名 (例如: yourdomain.com)

    # 强制将所有 HTTP 请求 301 重定向到 HTTPS 安全连接
    return 301 https://$host$request_uri;
}

# 2. HTTPS 443 端口服务块
server {
    listen 443 ssl http2;
    server_name yourdomain.com; # 替换为您的线上域名

    # SSL 证书与私钥路径
    ssl_certificate     /etc/nginx/ssl/yourdomain.com.pem;
    ssl_certificate_key /etc/nginx/ssl/yourdomain.com.key;

    # SSL 会话优化与现代安全协议
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS 安全响应头
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 通用安全防护头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 静态资源 Gzip 自动化压缩
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # 静态前端资源目录
    root   /home/ubuntu/vue-cli-lazy/dist;
    index  index.html;

    # 支持 Vue Router History 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================================================================
    # 多微服务反向代理 (对应 src/config/index.js 中的生产 'build:prd' 规则)
    # =========================================================================

    # 2.1 通用 API 微服务 (/api/)
    location /api/ {
        proxy_pass https://yourdomain.com/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    # 2.2 用户微服务 (/user/)
    location /user/ {
        proxy_pass https://yourdomain.com/user-service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2.3 订单微服务 (/order/)
    location /order/ {
        proxy_pass https://yourdomain.com/order-service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2.4 WebSocket 长连接服务 (/socket)
    location /socket {
        proxy_pass wss://yourdomain.com/socket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # 静态资源浏览器强缓存
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
