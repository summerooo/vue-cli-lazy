# =========================================================================
# vue-cli-lazy 简易 HTTP 企业级 Nginx 配置文件
# 完美对齐 src/config/index.js 的多后端微服务反向代理架构:
# 1. /api/    --> 8080 端口通用 API 服务
# 2. /user/   --> 8081 端口用户微服务 (user-service)
# 3. /order/  --> 8082 端口订单微服务 (order-service)
# 4. /socket  --> 8181 端口 WebSocket 长连接服务
# 5. History 模式 404 回退 (try_files $uri $uri/ /index.html)
# =========================================================================

server {
    listen       80;
    server_name  localhost; # 生产环境替换为您的服务器域名或 IP (例如: 192.168.1.100)

    # 1. 静态资源开启 Gzip 高效压缩
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # 2. SPA 静态资源打包产物根目录
    root   /usr/share/nginx/html; # 服务器上存放 vue-cli-lazy/dist 的路径
    index  index.html;

    # 3. 解决 Vue Router History 模式刷新 404 的核心配置
    location / {
        try_files $uri $uri/ /index.html;
    }

    # =========================================================================
    # 4. 后端多微服务反向代理 (与 src/config/index.js 规则 1:1 精准对应)
    # =========================================================================

    # 4.1 通用 API 微服务代理 (对应 targetApi)
    location /api/ {
        proxy_pass http://192.168.1.100:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    # 4.2 用户微服务代理 (对应 targetUser)
    location /user/ {
        proxy_pass http://192.168.1.105:8081/user-service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4.3 订单微服务代理 (对应 targetOrder)
    location /order/ {
        proxy_pass http://192.168.1.108:8082/order-service/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4.4 WebSocket 长连接服务代理 (对应 targetSocket)
    location /socket {
        proxy_pass http://192.168.1.105:8181;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # 5. 静态资源浏览器强缓存 (提升重复访问速度)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
    }

    # 6. 错误页面重定向
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
